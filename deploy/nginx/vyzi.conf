# Host Nginx for the API and the admin dashboard.
# Replace api.example.com / admin.example.com, copy to
# /etc/nginx/sites-available/, then run certbot --nginx to add HTTPS.

server {
    listen 80;
    server_name api.example.com;

    # Uploads are capped at 10 MB by the API; leave room for multipart overhead.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Bill analysis waits on the AI provider.
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name admin.example.com;

    root /var/www/vyzi-dashboard;
    index index.html;

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints asset filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

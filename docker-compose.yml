services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: easyresparmio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5























































  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/easyresparmio
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      # `Up` only means the container is running — it says nothing about Nest
      # having bootstrapped. Probe the port so a broken boot shows as unhealthy.
      test: ["CMD-SHELL", "wget -qO- -T 3 http://127.0.0.1:3000/api/docs >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
